name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: agusarya592
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2390b8f0,%234779c4&color_dots=%23ebf2fc,%23c9dcf5,%239dc0ec,%236f9fdb,%234779c4&color_dots_border=%23d0d7de
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2390b8f0,%234779c4&color_dots=%230d1117,%23193a63,%23245691,%232f72bf,%234779c4&color_dots_border=%2330363d

      - name: Push the generated SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
